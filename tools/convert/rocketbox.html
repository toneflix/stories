<!doctype html><meta charset="utf-8"><body><script type="module">
// Converts Rocketbox FBX files to glTF in the browser with three.js's own loaders, so no
// native converter is needed. Driven by tools/convert-rocketbox.mjs.
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const exportGlb = (obj, animations = []) => new GLTFExporter().parseAsync(obj, { binary: true, animations, maxTextureSize: 1024, onlyVisible: false });
/** TGA textures load as raw pixel data; the exporter needs something it can draw. */
const drawable = (t) => {
  if (!t || !t.image?.data) return t;
  const { width, height, data } = t.image;
  const cv = document.createElement('canvas'); cv.width = width; cv.height = height;
  cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(data.buffer, data.byteOffset, width * height * 4), width, height), 0, 0);
  const c = new THREE.CanvasTexture(cv); c.flipY = t.flipY; c.colorSpace = t.colorSpace; c.wrapS = t.wrapS; c.wrapT = t.wrapT;
  return c;
};
/** Blurs a single-channel mask (0..1 floats) with the canvas's own blur. */
const blurMask = (mask, w, h, px) => {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h);
  for (let i = 0; i < mask.length; i++) { img.data[i * 4 + 3] = 255; img.data[i * 4] = mask[i] * 255; }
  ctx.putImageData(img, 0, 0);
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d'); o.filter = `blur(${px}px)`; o.drawImage(cv, 0, 0);
  const d = o.getImageData(0, 0, w, h).data;
  return mask.map((_, i) => d[i * 4] / 255);
};
/**
 * Ages a Rocketbox head texture: the dark hair on the scalp turns grey (the face is left
 * alone) and grey stubble is speckled over the chin and upper lip. Positions are in the
 * head texture's layout, which every Rocketbox adult shares.
 */
const greyHair = (tex) => {
  const cv = tex.image, ctx = cv.getContext('2d');
  const { width: W, height: H } = cv, img = ctx.getImageData(0, 0, W, H), px = img.data;
  const n = W * H, L = new Float32Array(n), hair = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i % W) / W, y = 1 - Math.floor(i / W) / H;   // canvas rows run opposite to the exported image
    L[i] = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) / 255;
    const face = ((x - 0.5) / 0.2) ** 2 + ((y - 0.68) / 0.2) ** 2;
    hair[i] = y > 0.5 ? Math.min(1, Math.max(0, (0.2 - L[i]) / 0.08)) * Math.min(1, Math.max(0, (face - 1) / 0.4)) : 0;
  }
  const m = blurMask(hair, W, H, 2);
  let seed = 3;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const speck = blurMask(Float32Array.from({ length: n }, () => (rand() > 0.55 ? 1 : 0)), W, H, 0.8);
  const tint = [0.93, 0.92, 0.9], stubble = [0.78, 0.77, 0.75];
  for (let i = 0; i < n; i++) {
    const x = (i % W) / W, y = 1 - Math.floor(i / W) / H;   // canvas rows run opposite to the exported image
    const g = Math.min(1, 0.3 + (L[i] / 0.2) * 0.5), a = m[i] * 0.8;
    const jaw = ((x - 0.5) / 0.19) ** 2 + ((y - 0.555) / 0.085) ** 2, lips = ((x - 0.5) / 0.075) ** 2 + ((y - 0.59) / 0.022) ** 2;
    const b = Math.min(1, Math.max(0, (1 - jaw) / 0.5)) * Math.min(1, Math.max(0, (lips - 1) / 0.6)) * speck[i] * 0.5;
    for (let c = 0; c < 3; c++) {
      const v = (px[i * 4 + c] / 255) * (1 - a) + g * tint[c] * a;
      px[i * 4 + c] = (v * (1 - b) + stubble[c] * b) * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  tex.needsUpdate = true;
};
/**
 * Re-dresses a dark-suited Rocketbox body texture in home clothes: the jacket's cloth
 * becomes a wax-print top and the trousers a plain cloth, keeping every fold and shadow
 * of the original. Regions are in the body texture's layout (x across, y up from the
 * bottom as the exporter writes it).
 */
const homeClothes = (tex, { top, print, bottom }) => {
  const cv = tex.image, ctx = cv.getContext('2d');
  const { width: W, height: H } = cv, img = ctx.getImageData(0, 0, W, H), px = img.data;
  const col = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16) / 255);
  const base = col(top), ink = print.map(col), low = col(bottom);
  for (let i = 0; i < W * H; i++) {
    const x = (i % W) / W, y = 1 - Math.floor(i / W) / H;
    const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
    const L = 0.299 * r + 0.587 * g + 0.114 * b, sat = Math.max(r, g, b) - Math.min(r, g, b);
    // the suit is near-black and grey; skin, shoes and the shirt are not
    const cloth = Math.min(1, Math.max(0, (0.32 - L) / 0.08)) * Math.min(1, Math.max(0, (0.12 - sat) / 0.05));
    if (cloth <= 0) continue;
    const legs = (x < 0.33 || x > 0.68) && y < 0.5;
    const shoes = y > 0.8 && (x < 0.33 || x > 0.68);
    if (shoes) continue;
    const shade = Math.min(1.8, Math.pow(L / 0.11, 0.85));
    let c = low;
    if (!legs) {
      // a wax print: big rings and dots on a coloured ground, in texture space
      const u = x * 26, v = y * 26, fu = u - Math.floor(u) - 0.5, fv = v - Math.floor(v) - 0.5, d = Math.hypot(fu, fv);
      const odd = (Math.floor(u) + Math.floor(v)) % 2;
      c = d < 0.14 ? ink[1] : d > 0.26 && d < 0.38 ? ink[odd] : base;
    }
    for (let k = 0; k < 3; k++) {
      const v = Math.min(1, c[k] * shade * 0.8);
      px[i * 4 + k] = (px[i * 4 + k] / 255 * (1 - cloth) + v * cloth) * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  tex.needsUpdate = true;
};
const toBase64 = (buf) => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); };

/** A Rocketbox avatar: centimetres to metres, Phong to PBR, opacity texture as alpha, optionally grey-haired or re-dressed. */
window.avatar = async (dir, name, opts = {}) => {
  const m = new THREE.LoadingManager();
  m.addHandler(/\.tga$/i, new TGALoader(m));
  m.setURLModifier((u) => (/\.tga$/i.test(u) ? `${dir}/Textures/${u.split(/[\\/]/).pop()}` : u));
  const fbx = await new FBXLoader(m).loadAsync(`${dir}/${name}.fbx`);
  await new Promise((res) => (m.onLoad = res, setTimeout(res, 4000)));
  fbx.traverse((o) => {
    if (!o.isMesh) return;
    o.material = [].concat(o.material).map((p) => {
      const alpha = /opacity/i.test(p.name);
      const s = new THREE.MeshStandardMaterial({ name: p.name, map: drawable(p.map), normalMap: alpha ? null : drawable(p.normalMap), roughness: 0.7, metalness: 0, side: alpha ? THREE.DoubleSide : THREE.FrontSide });
      if (s.map) s.map.colorSpace = THREE.SRGBColorSpace;
      if (alpha) { s.alphaTest = 0.5; s.transparent = false; }
      if (opts.greyHair && /head/i.test(p.name) && s.map) greyHair(s.map);
      if (opts.homeClothes && /body/i.test(p.name) && s.map) homeClothes(s.map, opts.homeClothes);
      return s;
    });
    if (o.material.length === 1) o.material = o.material[0];
  });
  const root = new THREE.Group(); root.name = name; root.scale.setScalar(0.01); root.add(fbx);
  return toBase64(await exportGlb(root));
};

/** A Rocketbox clip on the bare skeleton, renamed; `inPlace` drops the walk's forward travel. */
window.clip = async (url, rename, inPlace) => {
  const fbx = await new FBXLoader().loadAsync(url);
  const clip = fbx.animations[0];
  clip.name = rename;
  if (inPlace) for (const t of clip.tracks) if (/Bip01\.position$/.test(t.name)) {
    for (let i = 0; i < t.values.length; i += 3) { t.values[i] = t.values[0]; t.values[i + 1] = t.values[1]; }
  }
  fbx.traverse((o) => { if (o.isMesh) o.visible = false; });
  const root = new THREE.Group(); root.name = 'rig'; root.scale.setScalar(0.01); root.add(fbx);
  return toBase64(await exportGlb(root, [clip]));
};
document.documentElement.dataset.ready = '1';
</script></body>
