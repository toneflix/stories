<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toneflix Stories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #0b0914; --ink: #fff4e4; --muted: #b9aecb; --glow: #ffb45e; color-scheme: dark; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #2a1d3d, var(--bg) 70%); color: var(--ink);
        font-family: Fraunces, Georgia, serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
      main { max-width: 560px; width: 100%; }
      h1 { font-weight: 400; font-style: italic; font-size: clamp(36px, 8vw, 56px); margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 32px; }
      a.story { display: block; text-decoration: none; color: inherit; border: 1px solid #ffffff22; border-radius: 16px; padding: 20px 24px;
        background: #ffffff08; transition: border-color .2s, background .2s; }
      a.story:hover { border-color: var(--glow); background: #ffb45e14; }
      a.story h2 { margin: 0 0 6px; font-weight: 400; font-size: 26px; }
      a.story span { color: var(--muted); font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Toneflix Stories</h1>
      <p>Short interactive films. Watch, or step in.</p>
      <a class="story" href="./stories/lantern-keeper/">
        <h2>The Lantern Keeper</h2>
        <span>45 seconds · tap to help Pip light the great lantern</span>
      </a>
    </main>
  </body>
</html>
